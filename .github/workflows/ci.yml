name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest
      - name: Test on the JVM
        run: clojure -X:test
      - name: Compare uploads with slipset/deps-deploy
        run: clojure -X:aether-test
      - name: Test with bb
        run: bb test

  # A real deploy: a snapshot of the test library to Clojars from bb, one
  # OS at a time so the build numbers don't race. Needs the CLOJARS_USERNAME
  # and CLOJARS_PASSWORD secrets, so only on pushes to main.
  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
      CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
    defaults:
      run:
        shell: bash
        working-directory: test-resources/test-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest
      - name: Build the test library
        run: clojure -T:build jar :version '"0.0.0-SNAPSHOT"' :sources true
      - name: Deploy the snapshot with bb
        run: bb deploy-built 0.0.0-SNAPSHOT sources
